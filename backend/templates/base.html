<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bug Tracker{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f5f7; color: #222; }
        header { background: #243447; color: white; padding: 20px; }
        header h1 { margin: 0 0 15px; }
        nav a { color: white; margin-right: 20px; }
        main { max-width: 1100px; margin: 25px auto; padding: 20px; background: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: left; }
        th { background: #e8edf2; }
        label { display: block; margin-top: 12px; }
        input, select, textarea { box-sizing: border-box; padding: 8px; max-width: 100%; }
        button { background: #243447; color: white; padding: 10px 16px; border: 0; cursor: pointer; margin-top: 12px; }
        .error { color: #a02020; }
        .success { color: #216b36; }
        .table-wrapper { overflow-x: auto; }
    </style>
</head>
<body>
    <header>
        <h1>Software Bug Tracking System</h1>
        <nav>
            <a href="/bugs">All Bugs</a>
            <a href="/search">Search Bugs</a>
            <a href="/report">Report</a>
            <a href="/new_bug">New Bug</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
